<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f3e9">
    <title>磚塊花火｜ARCADE 07</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --paper: #f7f3e9;
            --ink: #20211f;
            --muted: #77756e;
            --line: #d9d4c8;
            --coral: #ff5e55;
            --lime: #d8f45b;
            --violet: #7457e8;
            --cyan: #55d9d1;
            --mono: "DM Mono", monospace;
            --display: "Space Grotesk", "Trebuchet MS", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background-color: var(--paper);
            background-image: radial-gradient(#c9c3b5 0.65px, transparent 0.65px);
            background-size: 14px 14px;
            font-family: var(--display);
        }

        button { font: inherit; }

        .page {
            width: min(1160px, calc(100% - 48px));
            margin: 0 auto;
            padding: 28px 0 34px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 19px;
            border-bottom: 1px solid var(--line);
        }

        .wordmark {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .mark {
            display: grid;
            width: 30px;
            height: 30px;
            place-items: center;
            border: 1px solid var(--ink);
            background: var(--lime);
            box-shadow: 3px 3px 0 var(--ink);
            font-size: 16px;
        }

        .edition {
            color: var(--muted);
            font: 11px var(--mono);
            letter-spacing: 0;
        }

        .intro {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 24px;
            padding: 28px 0 22px;
        }

        h1 {
            margin: 0;
            font-size: clamp(36px, 5vw, 58px);
            line-height: 0.98;
            letter-spacing: 0;
        }

        h1 span { color: var(--coral); }

        .intro-note {
            max-width: 245px;
            margin: 0 2px 3px 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;
        }

        .game-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 232px;
            align-items: stretch;
            gap: 18px;
        }

        .game-frame {
            position: relative;
            min-width: 0;
            overflow: hidden;
            border: 1px solid #252721;
            background: #111512;
            box-shadow: 7px 7px 0 var(--ink);
            isolation: isolate;
        }

        #game {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 480px;
            touch-action: none;
            outline: none;
        }

        .frame-tag {
            position: absolute;
            z-index: 1;
            top: 15px;
            left: 16px;
            color: rgba(255, 255, 255, 0.65);
            font: 10px var(--mono);
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            z-index: 2;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(12, 17, 14, 0.3);
            transition: opacity 180ms ease, visibility 180ms ease;
        }

        .overlay[hidden] { display: none; }

        .start-panel {
            width: min(320px, 100%);
            padding: 25px 25px 22px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            background: var(--lime);
            box-shadow: 6px 6px 0 var(--coral);
            text-align: center;
        }

        .panel-kicker {
            margin-bottom: 8px;
            color: #525d25;
            font: 10px var(--mono);
        }

        .start-panel h2 {
            margin: 0 0 8px;
            font-size: 30px;
            line-height: 1;
        }

        .start-panel p {
            margin: 0 0 18px;
            color: #4b4e36;
            font-size: 13px;
        }

        .start-button {
            min-height: 43px;
            padding: 0 20px;
            border: 1px solid var(--ink);
            background: var(--coral);
            box-shadow: 3px 3px 0 var(--ink);
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: transform 120ms ease, box-shadow 120ms ease;
        }

        .start-button:hover { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
        .start-button:focus-visible, .icon-button:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }

        .sidebar {
            display: flex;
            flex-direction: column;
            border-top: 3px solid var(--ink);
        }

        .score-block {
            padding: 16px 0 19px;
            border-bottom: 1px solid var(--line);
        }

        .eyebrow {
            color: var(--muted);
            font: 10px var(--mono);
        }

        .score {
            margin-top: 2px;
            font: 500 42px/1 var(--mono);
            letter-spacing: 0;
            font-variant-numeric: tabular-nums;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px 0;
            border-bottom: 1px solid var(--line);
        }

        .stat-value {
            margin-top: 4px;
            font: 19px var(--mono);
            font-variant-numeric: tabular-nums;
        }

        .life-dots { display: flex; gap: 5px; margin-top: 8px; }
        .life-dot { width: 9px; height: 9px; border: 1px solid var(--ink); border-radius: 50%; background: var(--coral); }
        .life-dot.lost { background: transparent; opacity: 0.32; }

        .progress-label {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin: 16px 0 7px;
            color: var(--muted);
            font: 10px var(--mono);
        }

        .progress-track { height: 7px; background: #e3ded3; }
        .progress-fill { width: 0; height: 100%; background: var(--violet); transition: width 180ms ease; }

        .controls {
            display: grid;
            gap: 11px;
            padding: 17px 0;
            border-bottom: 1px solid var(--line);
        }

        .control-row { display: flex; align-items: center; gap: 9px; color: #4e4e47; font-size: 11px; }
        kbd {
            display: inline-grid;
            min-width: 25px;
            height: 23px;
            padding: 0 5px;
            place-items: center;
            border: 1px solid #c6c0b4;
            border-bottom-width: 2px;
            background: #fffdf7;
            color: var(--ink);
            font: 10px var(--mono);
        }

        .icon-button {
            display: inline-flex;
            min-height: 35px;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            font-size: 11px;
        }

        .icon-button:hover { border-color: var(--ink); background: #fffdf7; }
        .sound-button { margin-top: auto; padding: 8px 10px; }
        .sound-button svg { width: 15px; height: 15px; }

        .bottomline {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding-top: 16px;
            color: var(--muted);
            font: 10px var(--mono);
        }

        .bottomline strong { color: var(--ink); font-weight: 500; }

        @media (min-width: 900px) {
            .game-frame { height: 590px; }
        }

        @media (max-width: 899px) {
            .page { width: min(760px, calc(100% - 32px)); padding-top: 18px; }
            .game-layout { grid-template-columns: minmax(0, 1fr) 190px; gap: 14px; }
            .game-frame { height: min(68vh, 600px); min-height: 430px; }
            #game { min-height: 0; }
            .score { font-size: 36px; }
        }

        @media (max-width: 620px) {
            .page { width: calc(100% - 28px); padding: 14px 0 20px; }
            .topbar { padding-bottom: 13px; }
            .intro { align-items: start; flex-direction: column; gap: 8px; padding: 22px 0 16px; }
            h1 { font-size: 42px; }
            .intro-note { max-width: none; font-size: 12px; }
            .game-layout { grid-template-columns: 1fr; gap: 13px; }
            .game-frame { height: min(64vh, 540px); min-height: 390px; box-shadow: 4px 4px 0 var(--ink); }
            .sidebar { display: grid; grid-template-columns: 1.1fr 1fr; column-gap: 18px; }
            .score-block { grid-row: span 2; padding-top: 11px; }
            .score { font-size: 35px; }
            .stats { align-content: start; padding: 11px 0; }
            .progress-label { margin-top: 11px; }
            .controls { gap: 8px; padding: 11px 0; }
            .control-row { font-size: 10px; }
            .sound-button { grid-column: 2; margin-top: 0; }
            .bottomline { padding-top: 13px; }
        }

        @media (max-width: 380px) {
            .sidebar { column-gap: 10px; }
            .control-row { gap: 5px; }
            .game-frame { min-height: 360px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="topbar">
            <div class="wordmark"><span class="mark" aria-hidden="true">✳</span><span>小小街機部</span></div>
            <div class="edition">PLAY NO. 07&nbsp; / &nbsp;2026</div>
        </header>

        <section class="intro" aria-label="遊戲介紹">
            <h1>磚塊<span>花火</span></h1>
            <p class="intro-note">瞄準、反彈，把整面彩色磚牆變成煙火。<br>小心別讓球掉出場外！</p>
        </section>

        <section class="game-layout" aria-label="打磚塊遊戲">
            <div class="game-frame">
                <div class="frame-tag">NEON BRICK BREAKER&nbsp; / &nbsp;3D</div>
                <div id="game" role="img" aria-label="3D 打磚塊遊戲畫面"></div>
                <div class="overlay" id="overlay">
                    <div class="start-panel">
                        <div class="panel-kicker" id="panelKicker">READY PLAYER ONE</div>
                        <h2 id="panelTitle">開打吧！</h2>
                        <p id="panelText">移動擋板，接住發光球球。</p>
                        <button class="start-button" id="startButton" type="button">開始遊戲　→</button>
                    </div>
                </div>
            </div>

            <aside class="sidebar" aria-label="遊戲資訊與設定">
                <div class="score-block">
                    <div class="eyebrow">目前得分 / SCORE</div>
                    <div class="score" id="score">00000</div>
                    <div class="progress-label"><span>磚塊進度</span><span id="brickCount">0 / 0</span></div>
                    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                </div>
                <div class="stats">
                    <div>
                        <div class="eyebrow">剩餘球數</div>
                        <div class="life-dots" id="lives" aria-label="剩餘 3 顆球">
                            <span class="life-dot"></span><span class="life-dot"></span><span class="life-dot"></span>
                        </div>
                    </div>
                    <div>
                        <div class="eyebrow">關卡</div>
                        <div class="stat-value" id="level">01</div>
                    </div>
                </div>
                <div class="controls">
                    <div class="control-row"><span><kbd>←</kbd> <kbd>→</kbd></span><span>移動擋板</span></div>
                    <div class="control-row"><kbd>空白</kbd><span>發球 / 暫停</span></div>
                    <div class="control-row"><span>滑鼠或手指</span><span>直接移動</span></div>
                </div>
                <button class="icon-button sound-button" id="soundButton" type="button" aria-pressed="true" aria-label="關閉音效">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
                    <span id="soundLabel">音效開啟</span>
                </button>
            </aside>
        </section>

        <footer class="bottomline"><span>一局又一局，<strong>快樂不打烊。</strong></span><span>← → / SPACE / POINTER</span></footer>
    </main>

    <script>
        (() => {
            const host = document.getElementById('game');
            const overlay = document.getElementById('overlay');
            const startButton = document.getElementById('startButton');
            const scoreElement = document.getElementById('score');
            const livesElement = document.getElementById('lives');
            const levelElement = document.getElementById('level');
            const brickCountElement = document.getElementById('brickCount');
            const progressFill = document.getElementById('progressFill');
            const panelKicker = document.getElementById('panelKicker');
            const panelTitle = document.getElementById('panelTitle');
            const panelText = document.getElementById('panelText');
            const soundButton = document.getElementById('soundButton');
            const soundLabel = document.getElementById('soundLabel');

            const { Engine, Bodies, Body, Composite, Events, Vector } = Matter;
            const worldWidth = 12;
            const worldDepth = 18;
            const engine = Engine.create({ enableSleeping: false });
            engine.gravity.scale = 0;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#111512');
            scene.fog = new THREE.Fog('#111512', 22, 38);
            const camera = new THREE.PerspectiveCamera(43, 1, 0.1, 80);
            camera.position.set(0, 18.8, 21.5);
            camera.lookAt(0, 0, -0.4);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.28;
            host.appendChild(renderer.domElement);

            scene.add(new THREE.HemisphereLight('#bde9ff', '#39263e', 2.15));
            const keyLight = new THREE.DirectionalLight('#fff1d0', 3.2);
            keyLight.position.set(-6, 13, 9);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.set(1024, 1024);
            scene.add(keyLight);
            const pinkLight = new THREE.PointLight('#ff4eb8', 35, 18);
            pinkLight.position.set(-4, 5, -5);
            scene.add(pinkLight);
            const cyanLight = new THREE.PointLight('#49e3df', 30, 16);
            cyanLight.position.set(5, 5, 5);
            scene.add(cyanLight);

            const floor = new THREE.Mesh(
                new THREE.BoxGeometry(worldWidth + 0.7, 0.32, worldDepth + 0.8),
                new THREE.MeshStandardMaterial({ color: '#202821', roughness: 0.37, metalness: 0.34 })
            );
            floor.position.set(0, -0.28, 0);
            floor.receiveShadow = true;
            scene.add(floor);

            const board = new THREE.Mesh(
                new THREE.PlaneGeometry(worldWidth, worldDepth, 1, 1),
                new THREE.MeshStandardMaterial({ color: '#17201d', roughness: 0.56, metalness: 0.14 })
            );
            board.rotation.x = -Math.PI / 2;
            board.position.y = -0.1;
            scene.add(board);

            const grid = new THREE.GridHelper(worldDepth, 18, '#557363', '#2c4037');
            grid.position.set(0, -0.085, 0);
            if (Array.isArray(grid.material)) grid.material.forEach((material) => { material.transparent = true; material.opacity = 0.32; });
            else { grid.material.transparent = true; grid.material.opacity = 0.32; }
            scene.add(grid);

            const borderMaterial = new THREE.MeshStandardMaterial({ color: '#343f37', roughness: 0.32, metalness: 0.48, emissive: '#203329', emissiveIntensity: 0.5 });
            function addRail(x, z, width, depth) {
                const rail = new THREE.Mesh(new THREE.BoxGeometry(width, 0.54, depth), borderMaterial);
                rail.position.set(x, 0.02, z);
                rail.castShadow = true;
                rail.receiveShadow = true;
                scene.add(rail);
            }
            addRail(-worldWidth / 2 - 0.27, 0, 0.54, worldDepth + 0.55);
            addRail(worldWidth / 2 + 0.27, 0, 0.54, worldDepth + 0.55);
            addRail(0, -worldDepth / 2 - 0.27, worldWidth + 1.08, 0.54);

            const wallBodies = [
                Bodies.rectangle(-worldWidth / 2 - 0.25, 0, 0.5, worldDepth, { isStatic: true, label: 'wall' }),
                Bodies.rectangle(worldWidth / 2 + 0.25, 0, 0.5, worldDepth, { isStatic: true, label: 'wall' }),
                Bodies.rectangle(0, -worldDepth / 2 - 0.25, worldWidth, 0.5, { isStatic: true, label: 'wall' })
            ];
            Composite.add(engine.world, wallBodies);

            const paddleWidth = 2.15;
            const paddleDepth = 0.38;
            const paddleZ = worldDepth / 2 - 1.12;
            const paddleBody = Bodies.rectangle(0, paddleZ, paddleWidth, paddleDepth, {
                isStatic: true,
                label: 'paddle',
                chamfer: { radius: 0.12 }
            });
            Composite.add(engine.world, paddleBody);
            const paddle = new THREE.Group();
            const paddleMesh = new THREE.Mesh(
                new THREE.BoxGeometry(paddleWidth, 0.34, paddleDepth),
                new THREE.MeshStandardMaterial({ color: '#d8f45b', emissive: '#93ac2e', emissiveIntensity: 0.45, roughness: 0.22, metalness: 0.32 })
            );
            paddleMesh.castShadow = true;
            paddle.add(paddleMesh);
            const paddleGlow = new THREE.PointLight('#d8f45b', 4, 4);
            paddleGlow.position.y = 0.15;
            paddle.add(paddleGlow);
            paddle.position.set(0, 0.2, paddleZ);
            scene.add(paddle);

            const ballRadius = 0.24;
            const ballBody = Bodies.circle(0, paddleZ - 0.45, ballRadius, {
                label: 'ball',
                restitution: 1,
                friction: 0,
                frictionAir: 0,
                density: 0.001
            });
            Composite.add(engine.world, ballBody);
            const ball = new THREE.Mesh(
                new THREE.SphereGeometry(ballRadius, 24, 18),
                new THREE.MeshStandardMaterial({ color: '#fff8d8', emissive: '#ffbd47', emissiveIntensity: 1.65, roughness: 0.17, metalness: 0.08 })
            );
            ball.castShadow = true;
            scene.add(ball);
            const ballGlow = new THREE.PointLight('#ffc857', 5, 4.2);
            scene.add(ballGlow);

            const colors = ['#ff5e55', '#ffad45', '#d8f45b', '#55d9d1', '#62a6ff', '#b67bff'];
            const brickMeshes = new Map();
            const brickBodies = new Map();
            const particles = [];
            let brickTotal = 0;
            let score = 0;
            let lives = 3;
            let level = 1;
            let state = 'ready';
            let paddleTarget = 0;
            let pointerActive = false;
            let muted = false;
            let audioContext = null;
            let lastTime = performance.now();
            let collisionSoundAt = 0;
            const clock = new THREE.Clock();

            function makeBricks() {
                for (const body of brickBodies.values()) Composite.remove(engine.world, body);
                for (const mesh of brickMeshes.values()) scene.remove(mesh);
                brickBodies.clear();
                brickMeshes.clear();

                const columns = 8;
                const rows = Math.min(5 + Math.floor((level - 1) / 2), 7);
                const gapX = 0.12;
                const brickWidth = (worldWidth - 1.08 - gapX * (columns - 1)) / columns;
                const brickDepth = 0.58;
                const startZ = -worldDepth / 2 + 1.65;
                brickTotal = columns * rows;

                for (let row = 0; row < rows; row++) {
                    for (let column = 0; column < columns; column++) {
                        const x = -((columns - 1) * (brickWidth + gapX)) / 2 + column * (brickWidth + gapX);
                        const z = startZ + row * (brickDepth + 0.14);
                        const color = colors[(row + column + level - 1) % colors.length];
                        const body = Bodies.rectangle(x, z, brickWidth, brickDepth, {
                            isStatic: true,
                            label: 'brick',
                            chamfer: { radius: 0.08 }
                        });
                        body.plugin.color = color;
                        const material = new THREE.MeshStandardMaterial({
                            color,
                            emissive: color,
                            emissiveIntensity: 0.26,
                            roughness: 0.27,
                            metalness: 0.18
                        });
                        const mesh = new THREE.Mesh(new THREE.BoxGeometry(brickWidth, 0.34, brickDepth), material);
                        mesh.position.set(x, 0.14, z);
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;
                        scene.add(mesh);
                        Composite.add(engine.world, body);
                        brickMeshes.set(body.id, mesh);
                        brickBodies.set(body.id, body);
                    }
                }
                updateBrickProgress();
            }

            function ensureAudio() {
                if (muted) return null;
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return null;
                if (!audioContext) audioContext = new AudioContextClass();
                if (audioContext.state === 'suspended') audioContext.resume();
                return audioContext;
            }

            function tone(frequency, duration, type = 'sine', volume = 0.055, slide = 1) {
                const context = ensureAudio();
                if (!context) return;
                const oscillator = context.createOscillator();
                const gain = context.createGain();
                const now = context.currentTime;
                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, now);
                oscillator.frequency.exponentialRampToValueAtTime(Math.max(30, frequency * slide), now + duration);
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(volume, now + 0.008);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                oscillator.connect(gain);
                gain.connect(context.destination);
                oscillator.start(now);
                oscillator.stop(now + duration + 0.01);
            }

            function soundFor(label, body) {
                if (label === 'brick') {
                    const colorIndex = colors.indexOf(body.plugin.color);
                    tone(370 + Math.max(0, colorIndex) * 78, 0.13, 'sine', 0.07, 1.35);
                } else if (label === 'paddle') {
                    tone(250, 0.085, 'triangle', 0.035, 1.55);
                } else if (label === 'wall') {
                    tone(190, 0.07, 'sine', 0.026, 1.25);
                }
            }

            function burst(x, z, color) {
                for (let index = 0; index < 11; index++) {
                    const mesh = new THREE.Mesh(
                        new THREE.SphereGeometry(0.035 + Math.random() * 0.055, 7, 6),
                        new THREE.MeshBasicMaterial({ color, transparent: true })
                    );
                    mesh.position.set(x, 0.3 + Math.random() * 0.15, z);
                    scene.add(mesh);
                    particles.push({
                        mesh,
                        vx: (Math.random() - 0.5) * 4.6,
                        vz: (Math.random() - 0.5) * 4.2,
                        vy: Math.random() * 2.5,
                        life: 0.42 + Math.random() * 0.28
                    });
                }
            }

            function updateScore(amount) {
                score += amount;
                scoreElement.textContent = String(score).padStart(5, '0');
            }

            function updateBrickProgress() {
                const remaining = brickBodies.size;
                brickCountElement.textContent = `${brickTotal - remaining} / ${brickTotal}`;
                progressFill.style.width = `${brickTotal ? ((brickTotal - remaining) / brickTotal) * 100 : 0}%`;
            }

            function updateLives() {
                livesElement.innerHTML = '';
                for (let index = 0; index < 3; index++) {
                    const dot = document.createElement('span');
                    dot.className = `life-dot${index >= lives ? ' lost' : ''}`;
                    dot.setAttribute('aria-hidden', 'true');
                    livesElement.appendChild(dot);
                }
                livesElement.setAttribute('aria-label', `剩餘 ${lives} 顆球`);
            }

            function resetBall() {
                Body.setPosition(ballBody, { x: paddle.position.x, y: paddleZ - 0.48 });
                Body.setVelocity(ballBody, { x: 0, y: 0 });
                Body.setAngularVelocity(ballBody, 0);
            }

            function setPanel(kicker, title, text, buttonText) {
                panelKicker.textContent = kicker;
                panelTitle.textContent = title;
                panelText.textContent = text;
                startButton.textContent = buttonText;
                overlay.hidden = false;
            }

            function launch() {
                if (state === 'running') return;
                ensureAudio();
                if (state === 'paused') {
                    state = 'running';
                    overlay.hidden = true;
                    return;
                }
                if (state === 'over' || state === 'won') {
                    score = 0;
                    lives = 3;
                    level = 1;
                    scoreElement.textContent = '00000';
                    levelElement.textContent = '01';
                    updateLives();
                    makeBricks();
                }
                state = 'running';
                overlay.hidden = true;
                const direction = Math.random() > 0.5 ? 1 : -1;
                Body.setVelocity(ballBody, { x: direction * (3.4 + level * 0.14), y: -7.2 - Math.min(level * 0.2, 2.5) });
                tone(520, 0.16, 'triangle', 0.045, 1.5);
            }

            function pause() {
                if (state !== 'running') return;
                state = 'paused';
                setPanel('PAUSE', '先喘口氣', '球球等你回來再繼續。', '繼續遊戲　→');
            }

            function loseLife() {
                lives -= 1;
                updateLives();
                tone(210, 0.34, 'sawtooth', 0.075, 0.35);
                if (lives <= 0) {
                    state = 'over';
                    setPanel('GAME OVER', '再試一次？', `這次拿下 ${score} 分。`, '重新開始　→');
                    return;
                }
                state = 'ready';
                resetBall();
                setPanel('多一顆機會', '接好球！', `還有 ${lives} 顆球，準備好了再發球。`, '繼續遊戲　→');
            }

            function pointerToWorld(event) {
                const rect = renderer.domElement.getBoundingClientRect();
                const normalizedX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                const normalizedY = -(((event.clientY - rect.top) / rect.height) * 2 - 1);
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(normalizedX, normalizedY), camera);
                const hit = new THREE.Vector3();
                if (!raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit)) return;
                paddleTarget = THREE.MathUtils.clamp(hit.x, -worldWidth / 2 + paddleWidth / 2, worldWidth / 2 - paddleWidth / 2);
            }

            host.addEventListener('pointerdown', (event) => {
                pointerActive = true;
                host.setPointerCapture(event.pointerId);
                pointerToWorld(event);
                if (state === 'ready') launch();
            });
            host.addEventListener('pointermove', (event) => {
                if (pointerActive || event.pointerType === 'mouse') pointerToWorld(event);
            });
            host.addEventListener('pointerup', () => { pointerActive = false; });
            host.addEventListener('pointercancel', () => { pointerActive = false; });
            startButton.addEventListener('click', launch);

            window.addEventListener('keydown', (event) => {
                if (['ArrowLeft', 'ArrowRight', ' ', 'a', 'A', 'd', 'D'].includes(event.key)) event.preventDefault();
                if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') paddleTarget = Math.max(-worldWidth / 2 + paddleWidth / 2, paddleTarget - 0.72);
                if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') paddleTarget = Math.min(worldWidth / 2 - paddleWidth / 2, paddleTarget + 0.72);
                if (event.code === 'Space') {
                    if (state === 'running') pause();
                    else launch();
                }
            });

            soundButton.addEventListener('click', () => {
                muted = !muted;
                soundButton.setAttribute('aria-pressed', String(!muted));
                soundButton.setAttribute('aria-label', muted ? '開啟音效' : '關閉音效');
                soundLabel.textContent = muted ? '音效關閉' : '音效開啟';
                soundButton.querySelector('svg').style.opacity = muted ? '0.45' : '1';
                if (!muted) tone(590, 0.1, 'sine', 0.04, 1.25);
            });

            Events.on(engine, 'collisionStart', (event) => {
                const now = performance.now();
                for (const pair of event.pairs) {
                    const { bodyA, bodyB } = pair;
                    const ballContact = bodyA.label === 'ball' ? bodyB : bodyB.label === 'ball' ? bodyA : null;
                    if (!ballContact) continue;
                    if (ballContact.label === 'brick' && brickBodies.has(ballContact.id)) {
                        const mesh = brickMeshes.get(ballContact.id);
                        const color = ballContact.plugin.color;
                        burst(ballContact.position.x, ballContact.position.y, color);
                        Composite.remove(engine.world, ballContact);
                        brickBodies.delete(ballContact.id);
                        if (mesh) {
                            scene.remove(mesh);
                            mesh.geometry.dispose();
                            mesh.material.dispose();
                            brickMeshes.delete(ballContact.id);
                        }
                        updateScore(10 * level);
                        updateBrickProgress();
                        soundFor('brick', ballContact);
                        if (brickBodies.size === 0) {
                            level += 1;
                            levelElement.textContent = String(level).padStart(2, '0');
                            makeBricks();
                            resetBall();
                            state = 'ready';
                            setPanel('NICE SHOT', `第 ${level - 1} 關完成！`, '新的一面磚牆正在登場。', '挑戰下一關　→');
                            tone(740, 0.32, 'triangle', 0.065, 1.5);
                            tone(980, 0.28, 'sine', 0.045, 1.2);
                            break;
                        }
                    } else if (now - collisionSoundAt > 45) {
                        collisionSoundAt = now;
                        soundFor(ballContact.label);
                    }
                }
            });

            function syncView() {
                paddle.position.x = paddleBody.position.x;
                ball.position.set(ballBody.position.x, 0.26, ballBody.position.y);
                ballGlow.position.copy(ball.position);
                for (const [id, mesh] of brickMeshes) {
                    mesh.rotation.y = Math.sin(clock.elapsedTime * 1.2 + id) * 0.018;
                }
            }

            function resize() {
                const width = host.clientWidth;
                const height = host.clientHeight;
                if (!width || !height) return;
                renderer.setSize(width, height, false);
                camera.aspect = width / height;
                camera.fov = width < 620 ? 48 : 43;
                camera.updateProjectionMatrix();
            }

            function frame(now) {
                requestAnimationFrame(frame);
                const delta = Math.min((now - lastTime) / 1000, 0.033);
                lastTime = now;
                clock.getDelta();

                if (state === 'running') {
                    Body.setPosition(paddleBody, { x: paddleTarget, y: paddleZ });
                    if (Math.abs(paddleBody.velocity.x) > 0) Body.setVelocity(paddleBody, { x: 0, y: 0 });
                    Engine.update(engine, delta * 1000);

                    const speed = Vector.magnitude(ballBody.velocity);
                    const targetSpeed = 7.9 + Math.min(level * 0.32, 2.4);
                    if (speed > 0 && Math.abs(speed - targetSpeed) > 0.04) {
                        Body.setVelocity(ballBody, Vector.mult(Vector.normalise(ballBody.velocity), targetSpeed));
                    }

                    if (ballBody.position.y > worldDepth / 2 + 0.6) loseLife();
                    if (ballContactPaddle()) {
                        const offset = (ballBody.position.x - paddleBody.position.x) / (paddleWidth / 2);
                        const normalizedOffset = THREE.MathUtils.clamp(offset, -0.82, 0.82);
                        const outgoingX = normalizedOffset * 7.5;
                        const outgoingY = -Math.sqrt(Math.max(14, targetSpeed * targetSpeed - outgoingX * outgoingX));
                        Body.setPosition(ballBody, { x: ballBody.position.x, y: paddleZ - ballRadius - 0.04 });
                        Body.setVelocity(ballBody, { x: outgoingX, y: outgoingY });
                    }
                } else {
                    Body.setPosition(paddleBody, { x: paddleTarget, y: paddleZ });
                    if (state === 'ready') resetBall();
                }

                for (let index = particles.length - 1; index >= 0; index--) {
                    const particle = particles[index];
                    particle.life -= delta;
                    particle.mesh.position.x += particle.vx * delta;
                    particle.mesh.position.z += particle.vz * delta;
                    particle.mesh.position.y += particle.vy * delta;
                    particle.vy -= 7 * delta;
                    particle.mesh.material.opacity = Math.max(0, particle.life / 0.7);
                    if (particle.life <= 0) {
                        scene.remove(particle.mesh);
                        particle.mesh.geometry.dispose();
                        particle.mesh.material.dispose();
                        particles.splice(index, 1);
                    }
                }

                syncView();
                const pulse = 0.94 + Math.sin(now * 0.006) * 0.06;
                ball.scale.setScalar(pulse);
                renderer.render(scene, camera);
            }

            function ballContactPaddle() {
                return ballBody.velocity.y > 0
                    && ballBody.position.y + ballRadius >= paddleZ - paddleDepth / 2
                    && ballBody.position.y - ballRadius <= paddleZ + paddleDepth / 2
                    && Math.abs(ballBody.position.x - paddleBody.position.x) <= paddleWidth / 2 + ballRadius;
            }

            makeBricks();
            updateLives();
            resize();
            new ResizeObserver(resize).observe(host);
            requestAnimationFrame(frame);
        })();
    </script>
</body>
</html>
